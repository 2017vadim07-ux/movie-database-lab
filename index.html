<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практична робота №5</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f2f4f8;
      color: #222;
    }

    .box {
      max-width: 700px;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    button {
      padding: 10px 15px;
      background: #1f3b57;
      color: white;
      border: none;
      cursor: pointer;
      margin-bottom: 15px;
    }

    button:hover {
      background: #315c84;
    }

    img {
      width: 140px;
      display: block;
      margin: 10px 0;
    }

    pre {
      background: #111827;
      color: #e5e7eb;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Практична робота №5</h1>
    <h2>Асинхронне програмування та робота з API</h2>

    <button id="loadPokemon">Load Pokémon Data</button>

    <div id="pokemonCard"></div>
    <pre id="pokemonOutput">Натисніть кнопку, щоб завантажити дані.</pre>
  </div>

  <script src="script.js"></script>
</body>
</html>
