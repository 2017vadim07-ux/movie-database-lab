<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практична робота №7</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f2f4f8;
      color: #222;
    }

    .box {
      max-width: 800px;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px 0;
    }

    button {
      cursor: pointer;
      background: #1f3b57;
      color: white;
      border: none;
    }

    button:hover {
      background: #315c84;
    }

    ul {
      padding-left: 0;
    }

    li {
      list-style: none;
      background: #e8f0ff;
      margin: 8px 0;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    li.done {
      text-decoration: line-through;
      background: #d4f8d4;
    }

    .delete {
      float: right;
      background: #b91c1c;
      padding: 5px 8px;
    }

    pre {
      background: #111827;
      color: #e5e7eb;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Практична робота №7</h1>
    <h2>JSON, localStorage та обробка даних</h2>

    <button id="loadData">Завантажити приклад JSON</button>
    <pre id="output">Натисніть кнопку, щоб побачити JSON.</pre>

    <hr>

    <h2>To-do list з localStorage</h2>

    <input type="text" id="taskInput" placeholder="Введіть завдання">
    <button id="addTask">Додати завдання</button>
    <button id="clearTasks">Очистити все</button>

    <p id="stats"></p>

    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
